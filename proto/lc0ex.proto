syntax = "proto2";

package pblczero;

// Target for which an executable was compiled.
message Target {
  enum Vendor {
    VENDOR_UNKNOWN = 0;
    VENDOR_NVIDIA = 1;
  }

  required Vendor vendor = 1;

  // Vendor-specific architecture identifier, e.g. "sm_80" or "sm_90a" for
  // NVIDIA.
  required string architecture = 2;
}

// A serialized neural-network executable.
message NeuralExecutable {

  // Must be 0x1c0e. This catches common wrong-file errors before processing
  // the rest of the message.
  required fixed32 magic = 1;

  // The current format generation (currently, 1).
  required uint32 format = 2;
  // Opaque metadata for identifying and validating the executable, such as its
  // minimum supported Lc0 version and network architecture fingerprint.
  optional bytes metadata = 3;

  required Target target = 4;

  repeated Binary binaries = 10;
  repeated Allocation allocations = 11;
  repeated Parameter parameters = 12;
  repeated Buffer buffers = 13;
  repeated Kernel kernels = 14;
  repeated Program programs = 15;
}

// An embedded binary module. A binary may contain any number of exported symbols.
message Binary {
  enum Format {
    FORMAT_UNKNOWN = 0;
    FORMAT_CUBIN = 1;
  }

  required Format format = 1;
  required bytes data = 2;
}

// A physical device-memory allocation. Buffers and kernel arguments refer to
// these allocations by index in NeuralExecutable.allocations.
message Allocation {
  enum Lifetime {
    LIFETIME_UNKNOWN = 0;

    // Exists for the lifetime of the loaded backend. This is intended for
    // network weights and other immutable constants.
    LIFETIME_PERSISTENT = 1;

    // Exists for the lifetime of a computation context. This may contain named
    // input and output buffers alongside internal activations and scratch
    // storage. A runtime may create several instances to support concurrent
    // computations.
    LIFETIME_EXECUTION = 2;
  }

  required uint64 size_bytes = 1;
  required uint64 alignment_bytes = 2;
  required Lifetime lifetime = 3;
}

// A typed named memory range supplied to the runtime. Internal unnamed ranges
// are referenced directly by kernel arguments and are not listed here.
message Buffer {
  // Types value match ONNX TensorProto.DataType. Only types currently used by this
  // executable format are listed.
  enum DataType {
    DATA_TYPE_UNKNOWN = 0;
    DATA_TYPE_F32 = 1;
    DATA_TYPE_U8 = 2;
    DATA_TYPE_F16 = 10;
    DATA_TYPE_U64 = 13;
    DATA_TYPE_BF16 = 16;
  }

  required string name = 1;
  required uint32 allocation_idx = 2;
  required uint64 allocation_offset = 3;
  required DataType data_type = 4;
  repeated uint64 shape = 5;
}

// Kernel ABI parameter types supported by the initial format generation.
enum ParameterType {
  PARAMETER_TYPE_UNKNOWN = 0;
  PARAMETER_TYPE_U32 = 1;
  PARAMETER_TYPE_POINTER = 2;
}

// A runtime-supplied value. Its value is provided separately for each
// invocation.
message Parameter {
  required string name = 1;
  required ParameterType type = 2;
}

// A function exported by one of the embedded binaries.
message Kernel {
  required uint32 binary_idx = 1;
  required string function = 2;

  // Complete parameter list in ABI order. Every Node referencing this kernel
  // must provide arguments with the same number and sequence of effective types.
  repeated ParameterType parameters = 3;
}

// One executable variant. Metadata is opaque to this format and describes the
// conditions under which the runtime may select the program.
message Program {
  required string name = 1;
  optional bytes metadata = 2;
  repeated Node nodes = 3;
}

// A kernel invocation in the dependency graph.
message Node {
  // A parameter name or an allocation location. Exactly one of parameter_name
  // and the allocation location must be present.
  message Argument {
    optional string parameter_name = 1;
    optional uint32 allocation_idx = 2;
    optional uint64 allocation_offset = 3;
  }

  required uint32 kernel_idx = 1;

  // Indices of nodes in this Program that must complete before this node starts.
  repeated uint32 dependencies = 2;
  // Arguments in kernel ABI order. An allocation location has effective type
  // PARAMETER_TYPE_POINTER, while a parameter has its declared type.
  repeated Argument arguments = 3;

  // Launch dimensions in x, y, z order. Each field must contain between one and
  // three nonzero values; omitted trailing dimensions are one.
  repeated uint32 grid = 4;
  repeated uint32 block = 5;

  // Dynamic shared memory requested for this launch.
  required uint32 dynamic_shared_memory_bytes = 6;
}
